[project]
name = "ashen-support"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "pydantic-settings>=2.7,<3", "argon2-cffi>=23,<26", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "jieba>=0.42,<1", "rank-bm25>=0.2,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
