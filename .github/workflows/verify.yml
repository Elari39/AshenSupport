name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ashen
          POSTGRES_PASSWORD: ashen-test-only
          POSTGRES_DB: ashen_test
        ports: ['55439:5432']
        options: --health-cmd "pg_isready -U ashen -d ashen_test" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@12.5.1
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check . && uv run mypy app && uv run pytest -q
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
        env:
          ASHEN_TEST_DATABASE_URL: postgresql+psycopg://ashen:ashen-test-only@localhost:55439/ashen_test
      - run: pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test:unit && pnpm build
        working-directory: frontend
      - run: cp .env.example .env && docker compose up -d --build --wait
      - run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: frontend/test-results
      - run: docker compose down
        if: always()
